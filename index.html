<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* パステルパレット */
    --pink:      #f8c4d8;
    --pink-deep: #ee9dbd;
    --lavender:  #e3d8f4;
    --mint:      #d0eee2;
    --lemon:     #fcf3c8;
    --peach:     #fce0d2;
    --sky:       #dcebfa;

    /* パネル色（やわらかめ） */
    --yellow:    #f3d27a;
    --purple:    #c3b2e3;
    --green:     #98d3b4;
    --star:      #f3d27a;

    --paper:     #fff7fa;   /* 地色 */
    --panel:     #ffffff;
    --ink:       #5a4a52;
    --ink-soft:  #9a8590;
    --silver:    #dcdce4;
    --silver-hi: #f6f6fa;
    --silver-lo: #b9b9c6;

    --frame: linear-gradient(135deg, #fbd3e1 0%, var(--pink) 50%, #fbd3e1 100%);
  }

  * { box-sizing: border-box; }

  html, body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    margin: 0;
    padding: 16px 8px 24px;
    background: #ece9f1;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-weight: 500;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }

  .toolbar button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 22px;
    min-height: 44px;
    border: none;
    border-radius: 999px;
    background: var(--pink-deep);
    color: #fff;
    cursor: pointer;
  }

  .toolbar button.sub {
    background: #fff;
    color: var(--ink);
    border: 1px solid #ccc;
  }

  .hint { font-size: 12px; color: #888; text-align: center; max-width: 90vw; }

  /* ---- A4 = 1枚のカード ---- */
  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    padding: 7mm;
    background: var(--frame);
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,.15);
    transform-origin: top left;
  }

  .page-wrap { flex: 0 0 auto; }

  /* 外枠の内側ハイライト（ホロの艶） */
  .page::before {
    content: "";
    position: absolute;
    inset: 2.5mm;
    border: 0.5mm solid rgba(255,255,255,.75);
    border-radius: 5mm;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 5mm;
    border: 0.6mm solid rgba(255,255,255,.9);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.55) 0 2mm, rgba(255,255,255,0) 2.2mm),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,.55) 0 1.5mm, rgba(255,255,255,0) 1.7mm),
      radial-gradient(circle at 60% 90%, rgba(255,255,255,.5) 0 1.2mm, rgba(255,255,255,0) 1.4mm),
      repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 1.2mm, rgba(255,255,255,0) 1.2mm 4mm),
      var(--paper);
    padding: 6mm 6mm 5mm;
    display: flex;
    flex-direction: column;
    gap: 4.5mm;
  }

  /* ---- ネームバー ---- */
  .header {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    gap: 4mm;
  }

  .name-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3mm;
    padding: 2.5mm 5mm;
    background: rgba(255,255,255,.85);
    border: 0.6mm solid var(--pink);
    border-radius: 999px;
    min-height: 16mm;
  }

  .name-box .label {
    flex: 0 0 auto;
    font-size: 4mm;
    font-weight: 700;
    padding: 0.8mm 3mm;
    background: var(--pink);
    color: #fff;
    border-radius: 999px;
  }

  .name-box .value {
    flex: 1;
    font-size: 8.5mm;
    font-weight: 900;
    letter-spacing: .06em;
    line-height: 1.2;
  }

  .no-box {
    flex: 0 0 38mm;
    display: flex;
    align-items: center;
    gap: 2mm;
    padding: 2.5mm 4mm;
    background: rgba(255,255,255,.85);
    border: 0.6mm solid var(--lavender);
    border-radius: 999px;
    font-size: 4mm;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .no-box .value {
    flex: 1;
    font-size: 5.5mm;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
  }

  /* ---- 進化エリア: 銀ベベル ---- */
  .photo-area {
    /* 固定mmではなく割合にして、印刷可能領域が狭い環境（iOS）でも比例して縮むようにする */
    flex: 0 0 31.5%;
    padding: 1.6mm;
    border-radius: 3.5mm;
    background: linear-gradient(160deg, var(--silver-hi) 0%, var(--silver) 40%, var(--silver-lo) 100%);
  }

  .photo-inner {
    position: relative;
    height: 100%;
    border-radius: 2.4mm;
    border: 0.5mm solid rgba(255,255,255,.9);
    background: linear-gradient(180deg, #fffdf6 0%, #fff4f8 100%);
    padding: 5.5mm 4mm 5mm;
    display: flex;
    align-items: stretch;
    gap: 3mm;
  }

  .evo-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5mm;
    min-width: 0;
  }

  .evo-stage.before { flex: 0 0 44mm; justify-content: center; }
  .evo-stage.after  { flex: 1; }

  .photo-small,
  .photo-large {
    background: #fff;
    border-radius: 3mm;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-slot img {
    position: absolute;
    inset: 1.6mm;
    width: calc(100% - 3.2mm);
    height: calc(100% - 3.2mm);
    object-fit: cover;
    border-radius: 2mm;
    display: none;
  }

  .photo-slot.has-img img { display: block; }

  .photo-hint {
    font-size: 3.4mm;
    font-weight: 700;
    color: #d7c4cc;
    text-align: center;
    line-height: 1.5;
    pointer-events: none;
  }

  .photo-slot.has-img .photo-hint,
  .photo-slot.dragover .photo-hint { display: none; }
  .photo-slot.dragover { background: rgba(251,238,176,.5); }

  /* あかちゃん: 銀枠 */
  .photo-small {
    width: 44mm;
    height: 44mm;
    border: 0.5mm solid var(--silver);
    box-shadow: inset 0 0 0 1mm var(--silver-hi), inset 0 0 0 1.4mm var(--silver-lo);
  }

  /* いまのすがた: ピンクのハイライト枠 */
  .photo-large {
    flex: 1;
    width: 100%;
    border: 0.9mm solid var(--pink-deep);
    box-shadow: inset 0 0 0 1mm #fff, inset 0 0 0 1.5mm var(--pink);
    min-height: 0;
  }

  /* 進化の矢印 + 条件ラベル */
  .evo-link {
    flex: 0 0 26mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1mm;
    position: relative;
  }

  .evo-arrow {
    width: 20mm;
    height: 10mm;
    color: var(--pink-deep);
  }

  .evo-arrow svg { width: 100%; height: 100%; }

  .evo-link .sparkle { position: absolute; color: var(--star); }
  .evo-link .sparkle svg { width: 100%; height: 100%; }
  /* 矢印（中央）を囲むように6個 */
  .evo-link .sparkle.s1 { width: 6mm;   height: 6mm;   top: 30%; left: 6%; }
  .evo-link .sparkle.s2 { width: 4mm;   height: 4mm;   top: 33%; right: 10%; color: var(--pink-deep); }
  .evo-link .sparkle.s3 { width: 3mm;   height: 3mm;   top: 24%; left: 40%; color: var(--pink); }
  .evo-link .sparkle.s4 { width: 3mm;   height: 3mm;   bottom: 24%; right: 36%; }
  .evo-link .sparkle.s5 { width: 4.5mm; height: 4.5mm; bottom: 32%; left: 10%; color: var(--pink); }
  .evo-link .sparkle.s6 { width: 6mm;   height: 6mm;   bottom: 28%; right: 4%; }

  /* ---- 項目パネル ---- */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4mm;
    min-height: 0;
  }

  /* 角を落とした枠 + 枠に乗る大きなタブ見出し（参考画像実測） */
  .panel,
  .flavor {
    --bw:    0.8mm;   /* 枠線 */
    --cut:   3.8mm;   /* 角の切り落とし */
    --tabh:  10mm;    /* タブ高さ */
    --tabup: 1.6mm;   /* タブが枠より上に出る量 */
    --slant: 5.6mm;   /* タブ右辺の傾き */
    position: relative;
    display: flex;
    flex-direction: column;
    padding: calc(var(--tabh) + 1.5mm) 3.5mm 3mm;
    min-height: 0;
    overflow: hidden;
    z-index: 0;
  }

  .panel::before,
  .panel::after,
  .flavor::before,
  .flavor::after {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
  }

  /* 枠線（色地） */
  .panel::before,
  .flavor::before {
    inset: var(--tabup) 0 0 0;
    background: var(--c);
    clip-path: polygon(
      0 0,
      calc(100% - var(--cut)) 0,
      100% var(--cut),
      100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,
      var(--cut) 100%,
      0 calc(100% - var(--cut))
    );
  }

  /* 内側（白地に薄い色の洗い） */
  .panel::after,
  .flavor::after {
    --icut: calc(var(--cut) - 0.47mm);
    inset: calc(var(--tabup) + var(--bw)) var(--bw) var(--bw) var(--bw);
    background: rgba(255,255,255,.93);
    clip-path: polygon(
      0 0,
      calc(100% - var(--icut)) 0,
      100% var(--icut),
      100% calc(100% - var(--icut)),
      calc(100% - var(--icut)) 100%,
      var(--icut) 100%,
      0 calc(100% - var(--icut))
    );
  }

  .panel-title {
    --tc: 1.8mm;   /* タブ左上の角落とし */
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    height: var(--tabh);
    padding: 0 calc(var(--slant) + 4mm) 0 1mm;
    display: flex;
    align-items: center;
    gap: 3mm;
    background: var(--c);
    clip-path: polygon(0 var(--tc), var(--tc) 0, 100% 0, calc(100% - var(--slant)) 100%, 0 100%);
    color: #3d3339;
    font-size: 5mm;
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1;
  }

  .panel-title .t { transform: translateY(-0.3mm); }

  .panel-title::before {
    content: "";
    position: absolute;
    inset: var(--bw) 0 var(--bw) var(--bw);
    z-index: -1;
    background: color-mix(in srgb, var(--c) 42%, #fff);
    clip-path: polygon(
      0 var(--tc), var(--tc) 0,
      calc(100% - var(--bw) * 1.1) 0,
      calc(100% - var(--slant) - var(--bw) * 1.1) 100%,
      0 100%
    );
  }

  /* ルビはブラウザ差が大きいので flex で手動レイアウト */
  .panel-title .t {
    display: inline-flex;
    align-items: flex-end;
    line-height: 1;
  }
  .panel-title ruby {
    display: inline-flex;
    flex-direction: column-reverse;
    align-items: center;
    line-height: 1;
  }
  .panel-title rt {
    display: block;
    font-size: 2mm;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1;
    margin-bottom: 0.5mm;
    color: #6a5c63;
  }

  .panel-title .icon {
    width: 8.5mm;
    height: 8.5mm;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c) 78%, #c9587f);
    box-shadow: inset 0 0 0 0.6mm rgba(255,255,255,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .panel-title .icon svg {
    width: 5mm;
    height: 5mm;
    stroke-width: 2.4;
  }

  .panel-body {
    flex: 1;
    padding-top: 0.5mm;
    font-size: 4.2mm;
    line-height: 1.8;
    overflow: hidden;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  /* ---- 先生からのメッセージ ---- */
  .flavor {
    flex: 0 0 18%;
  }

  .flavor .panel-body {
    font-size: 4mm;
    line-height: 1.75;
  }

  /* ---- 下部の帯 ---- */
  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2mm;
    font-size: 3.2mm;
    color: var(--ink-soft);
    letter-spacing: .1em;
  }

  .footer .stars { color: var(--pink-deep); letter-spacing: .3em; }

  /* ---- 装飾イラスト ---- */
  .deco {
    position: absolute;
    pointer-events: none;
    z-index: 0;
    line-height: 0;
  }
  .deco svg { width: 100%; height: 100%; display: block; }

  /* 進化エリア: 右下にダンゴムシと草、左上に葉 */
  .deco.pill-1  { width: 28mm; height: 21.6mm; right: 2.5mm; bottom: 1.5mm; }
  .deco.grass-1 { width: 10mm; height: 8mm;  right: 20mm; bottom: 2mm; }
  .deco.star-1  { width: 4mm;  height: 4mm;  right: 6mm; top: 4mm; color: var(--star); }
  .deco.star-2  { width: 2.5mm; height: 2.5mm; right: 3mm; top: 10mm; color: var(--star); }

  /* パネル: 角に小さく */
  .deco.marks   { width: 5mm; height: 5mm; right: 3.5mm; top: calc(var(--tabup) + 2.5mm); color: var(--c); }
  .deco.leaf-2  { width: 8mm;  height: 8mm; right: 2.5mm; bottom: 2mm; }
  .deco.star-3  { width: 4mm;  height: 4mm; right: 3mm;   bottom: 3mm; color: var(--star); }
  .deco.star-4  { width: 2.5mm; height: 2.5mm; right: 8mm; bottom: 6mm; color: var(--star); }
  .deco.spark-1 { width: 4mm;  height: 4mm; right: 3mm;   bottom: 3mm; color: var(--lavender); }
  .deco.spark-2 { width: 2.5mm; height: 2.5mm; right: 8mm; bottom: 6mm; color: var(--lavender); }
  .deco.leaf-3  { width: 8mm;  height: 8mm; right: 2.5mm; bottom: 2mm; transform: rotate(15deg); }

  /* メッセージ枠: 左下に花、右下にダンゴムシ */
  .deco.flower-1 { width: 8mm; height: 8mm; left: 3mm;  bottom: 5.5mm; }
  .deco.flower-2 { width: 6mm; height: 6mm; left: 9.5mm; bottom: 2.5mm; }
  .deco.flower-3 { width: 5mm; height: 5mm; left: 3.5mm; bottom: 1.5mm; }
  .deco.pill-2   { width: 34mm; height: 17.8mm; right: 3.5mm; bottom: 2mm; }
  .deco.grass-2  { width: 9mm; height: 7mm; right: 21mm; bottom: 2.5mm; }

  /* ---- 入力欄 ---- */
  [contenteditable] { outline: none; border-radius: 2mm; }
  [contenteditable]:focus { background: rgba(251,238,176,.35); }
  [contenteditable]:empty::before {
    content: attr(data-placeholder);
    color: #d7c4cc;
    font-weight: 500;
  }

  /* ---- 印刷 ---- */
  @page { size: A4 portrait; margin: 0; }

  @media print {
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; padding: 0; background: #fff; display: block; }
    .toolbar, .hint { display: none !important; }
    /* iOS Safari は @page の余白指定を無視するため、用紙固定ではなく印刷可能領域に合わせる */
    .page-wrap { width: 100% !important; height: 100% !important; }
    .page { width: 100%; height: 100%; box-shadow: none; transform: none !important; page-break-after: avoid; }
    /* WebKit(iOS Safari)は印刷時に gradient のアルファを失い黒く塗るため、模様を外して不透明色にする */
    .card { background: var(--paper); }
    .name-box, .no-box { background: #fff; }
    .panel::after, .flavor::after { background: color-mix(in srgb, var(--c) 7%, #fff); }
    [contenteditable]:empty::before { content: none; }
    .photo-hint { display: none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">A4で印刷 / PDF保存</button>
  <button class="sub" onclick="clearAll()">入力をクリア</button>
</div>
<div class="hint">枠内をクリックして入力できます。印刷ダイアログで「用紙: A4」「余白: なし」「背景のグラフィック: ON」にしてください。</div>

<script>
  // 画面幅がA4より狭い場合はカード全体を縮小表示（印刷は等倍）
  function fitPage() {
    const page = document.querySelector('.page');
    const wrap = document.querySelector('.page-wrap');
    const avail = document.documentElement.clientWidth - 16;
    const scale = Math.min(1, avail / page.offsetWidth);
    page.style.transform = scale < 1 ? `scale(${scale})` : '';
    wrap.style.width  = scale < 1 ? `${page.offsetWidth * scale}px` : '';
    wrap.style.height = scale < 1 ? `${page.offsetHeight * scale}px` : '';
  }
  window.addEventListener('resize', fitPage);
  window.addEventListener('orientationchange', fitPage);
  fitPage();

  // ---- localStorage 自動保存 ----
  const STORAGE_KEY = 'introduction-card';

  function saveAll() {
    const data = { text: {}, photo: {} };
    document.querySelectorAll('[contenteditable][data-key]').forEach(el => {
      data.text[el.dataset.key] = el.innerText;
    });
    document.querySelectorAll('.photo-slot.has-img').forEach(slot => {
      data.photo[slot.dataset.key] = slot.querySelector('img').src;
    });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // 容量超過時は写真を除いて保存
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ text: data.text, photo: {} }));
      } catch (_) {}
    }
  }

  function loadAll() {
    let data;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (_) {}
    if (!data) return;
    Object.entries(data.text || {}).forEach(([k, v]) => {
      const el = document.querySelector(`[contenteditable][data-key="${k}"]`);
      if (el) el.innerText = v;
    });
    Object.entries(data.photo || {}).forEach(([k, v]) => {
      const slot = document.querySelector(`.photo-slot[data-key="${k}"]`);
      if (slot) { slot.querySelector('img').src = v; slot.classList.add('has-img'); }
    });
  }

  // PDF保存時のファイル名（ブラウザは document.title を使う）
  function updateTitle() {
    const name = document.querySelector('[data-key="name"]').innerText.trim();
    document.title = name ? `個人カード_${name}` : '個人カード';
  }

  let saveTimer;
  document.addEventListener('input', e => {
    if (!e.target.closest('[contenteditable]')) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 300);
    if (e.target.dataset.key === 'name') updateTitle();
  });
  window.addEventListener('beforeprint', updateTitle);

  function clearAll() {
    if (!confirm('入力内容をすべて消します。よろしいですか？')) return;
    document.querySelectorAll('[contenteditable]').forEach(el => el.textContent = '');
    document.querySelectorAll('.photo-slot').forEach(slot => {
      slot.classList.remove('has-img');
      slot.querySelector('img').removeAttribute('src');
    });
    localStorage.removeItem(STORAGE_KEY);
  }

  // 写真枠: クリックでファイル選択 / ドラッグ＆ドロップ
  const photoInput = document.getElementById('photo-input');
  let activeSlot = null;

  // 保存容量と印刷品質のバランスで長辺1600pxに縮小
  function setPhoto(slot, file) {
    if (!file || !file.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      slot.querySelector('img').src = canvas.toDataURL('image/jpeg', 0.85);
      slot.classList.add('has-img');
      saveAll();
    };
    img.src = URL.createObjectURL(file);
  }

  document.querySelectorAll('.photo-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      activeSlot = slot;
      photoInput.value = '';
      photoInput.click();
    });
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('dragover'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('dragover'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('dragover');
      setPhoto(slot, e.dataTransfer.files[0]);
    });
  });

  photoInput.addEventListener('change', () => {
    if (activeSlot) setPhoto(activeSlot, photoInput.files[0]);
  });

  // 貼り付けは書式なしテキストに統一
  document.addEventListener('paste', e => {
    if (!e.target.closest('[contenteditable]')) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });

  loadAll();
  updateTitle();
</script>
